<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08121d">
  <title>404 · Moxan System Resource Not Found</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='9' fill='%230e1b29'/%3E%3Cpath d='M14 47V18h6l12 15 12-15h6v29h-7V29L32 41 21 29v18z' fill='%23b9dce5'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="styles-extra.css">
</head>
<body>
  <div class="wallpaper wallpaper-base" aria-hidden="true"></div>
  <div class="wallpaper-overlay" aria-hidden="true"></div>
  <div class="ambient-light" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>
  <main class="not-found glass">
    <div class="section-label">MOXAN NETWORK · SYSTEM MESSAGE</div>
    <div class="not-found-code">404</div>
    <h1>SYSTEM RESOURCE<br>NOT FOUND</h1>
    <p>这个地址只能发现滚木。<br>桌面仍然亮着，回去看看吧。</p>
    <a href="https://nev.moxan.top/">默纤导航：nev.moxan.top</a>
    <br>
    <a class="button-primary" href="/">Return to desktop <span>↗</span></a>
    <small>C:\MOXAN\RESOURCE NOT FOUND</small>
  </main>
  <script src="images.js"></script>
  <script>
    const wallpaper = window.MoxanImages?.wallpapers?.[0];
    const background = document.querySelector('.wallpaper-base');
    if (wallpaper?.src && background) {
      if (/\.(mp4|webm)(?:[?#].*)?$/i.test(wallpaper.src)) {
        const video = document.createElement('video');
        video.className = 'wallpaper-video is-active';
        video.muted = true; video.loop = true; video.autoplay = true; video.playsInline = true;
        video.src = wallpaper.src;
        video.onerror = () => video.remove();
        document.body.prepend(video);
        video.play().catch(() => {});
      } else {
        background.style.backgroundImage = `linear-gradient(180deg,rgba(7,14,24,.27),rgba(8,15,25,.18) 38%,rgba(5,12,20,.6)),url(${JSON.stringify(wallpaper.src)})`;
        background.style.backgroundPosition = wallpaper.position || 'center';
      }
    }
  </script></body>
</html>
